<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#C6A15B" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#11100E" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C6A15B" />
      <stop offset="50%" stop-color="#EED59B" />
      <stop offset="100%" stop-color="#B18B36" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#11100E" />
  <rect width="1200" height="630" fill="url(#goldGlow)" />

  <!-- Outer Editorial Borders -->
  <rect x="40" y="40" width="1120" height="550" rx="8" fill="none" stroke="#C6A15B" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="48" y="48" width="1104" height="534" rx="4" fill="none" stroke="#C6A15B" stroke-width="0.75" stroke-opacity="0.2" stroke-dasharray="4 4" />

  <!-- Monogram Seal -->
  <circle cx="600" cy="180" r="46" fill="#1D1B17" stroke="#C6A15B" stroke-width="1.5" />
  <text x="600" y="194" font-family="'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="700" fill="#DFBF7A" text-anchor="middle" letter-spacing="2">MM</text>

  <!-- Name -->
  <text x="600" y="290" font-family="'Cormorant Garamond', Georgia, serif" font-size="54" font-weight="600" fill="#F5EFE6" text-anchor="middle" letter-spacing="4">MUSZAINI BINTI MUSA</text>

  <!-- Divider Rule -->
  <line x1="480" y1="320" x2="720" y2="320" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.7" />

  <!-- Subtitle -->
  <text x="600" y="370" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#C6A15B" text-anchor="middle" letter-spacing="5">LEGAL PROFESSIONAL · DIGITAL &amp; AI EXPLORER</text>

  <!-- Description -->
  <text x="600" y="430" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="400" fill="#B8B0A0" text-anchor="middle">
    Contracts &amp; Compliance · Risk Assessment · Emerging AI &amp; Agentic Workflows · Editorial Web Design
  </text>

  <!-- Footer Tags -->
  <text x="600" y="520" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#8E8575" text-anchor="middle" letter-spacing="2">
    LL.M. (DISTINCTION) · LL.B. (HONS) · KUALA LUMPUR, MALAYSIA
  </text>
